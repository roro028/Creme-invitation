
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .scene {
    width: 100%;
    height: 100vh;
    min-height: 700px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fdeaea;
    overflow: hidden;
    position: relative;
  }

  /* The invitation image — starts centered, hidden */
  .invite-img {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 420px);
    max-height: 85vh;
    object-fit: contain;
    border-radius: 3px;
    box-shadow: 0 16px 48px rgba(139,28,46,0.25);
    opacity: 0;
    z-index: 2;
    transition: opacity 0.6s ease 0.3s;
    display: block;
  }
  .invite-img.visible { opacity: 1; }

  /* Envelope — absolutely centered, slides down on open */
  .envelope-wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(90vw, 500px);
    aspect-ratio: 360 / 250;
    height: auto;
    cursor: pointer;
    z-index: 10;
    transition: top 0.9s cubic-bezier(0.4,0,0.2,1), transform 0.9s cubic-bezier(0.4,0,0.2,1), opacity 0.5s ease;
  }
  .envelope-wrapper:hover:not(.opening):not(.gone) { filter: brightness(1.03); }

  .env-flap {
    position: absolute;
    top: 30; left: 0;
    width: 100%;
    z-index: 10;
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .flap-opened { transform: perspective(600px) rotateX(-180deg); }

  /* Slide envelope down off screen */
  .envelope-wrapper.gone {
    top: 150%;
    opacity: 0;
    cursor: default;
  }

  .click-hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-family: Arial, sans-serif;
    color: #8b1c2e;
    letter-spacing: 2px;
    animation: pulse 2s infinite;
    white-space: nowrap;
    z-index: 20;
  }
  @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:0.85} }

  .reset-btn {
    display: none;
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    background: none;
    border: 1.5px solid #8b1c2e;
    color: #8b1c2e;
    font-size: 10px;
    letter-spacing: 2px;
    font-family: Arial, sans-serif;
    padding: 7px 22px;
    border-radius: 30px;
    cursor: pointer;
    z-index: 20;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s;
  }
  .reset-btn:hover { background: #8b1c2e; color: #fdeaea; }

@media (max-width: 768px) {
  .scene {
    min-height: 100vh;
  }

  .envelope-wrapper {
    width: 92vw;
  }

  .invite-img {
    width: 95vw;
    max-height: 88vh;
  }

  .click-hint {
    font-size: 14px;
    letter-spacing: 1px;
    bottom: 30px;
  }

  .reset-btn {
    font-size: 14px;
    padding: 10px 28px;
  }
}

</style>

  <!-- Envelope on top -->
  <div class="envelope-wrapper" id="envWrap" onclick="openEnvelope()">
    <svg width="100%" height="100%" viewBox="0 0 360 250" preserveAspectRatio="xMidYMid meet" style="position:absolute;top:0;left:0;" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="360" height="250" rx="4" fill="#f5d0d0" stroke="#b8394a" stroke-width="2"/>
      <polygon points="0,0 0,250 180,140" fill="#eebfc8" stroke="#b8394a" stroke-width="1"/>
      <polygon points="360,0 360,250 180,140" fill="#e8b2bc" stroke="#b8394a" stroke-width="1"/>
      <polygon points="0,250 360,250 180,140" fill="#f0c4cc" stroke="#b8394a" stroke-width="1"/>
      <circle cx="180" cy="158" r="22" fill="#8b1c2e"/>
      <text x="180" y="165" text-anchor="middle" font-size="16" fill="#fdeaea" font-family="Georgia" font-weight="bold">C</text>
    </svg>
    <div class="env-flap" id="envFlap">
      <svg width="100%" height="100%" viewBox="0 0 360 125" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,0 360,0 180,125" fill="#f5d0d0" stroke="#b8394a" stroke-width="2"/>
        <line x1="18" y1="10" x2="342" y2="10" stroke="#b8394a" stroke-width="0.7" opacity="0.35"/>
      </svg>
    </div>
  </div>

  <div class="click-hint" id="hint">✉ click to open</div>
  <button class="reset-btn" id="resetBtn" onclick="resetEnvelope()">close</button>
</div>

<script>
  let opened = false;

  function openEnvelope() {
    if (opened) return;
    opened = true;

    const envWrap = document.getElementById('envWrap');
    const flap = document.getElementById('envFlap');
    const hint = document.getElementById('hint');
    const resetBtn = document.getElementById('resetBtn');
    const img = document.getElementById('inviteImg');

    envWrap.classList.add('opening');
    hint.style.opacity = '0';
    hint.style.animation = 'none';

    // Step 1: open flap
    flap.classList.add('flap-opened');

    // Step 2: slide envelope off screen down
    setTimeout(() => {
      envWrap.classList.add('gone');
    }, 600);

    // Step 3: fade in invitation image centered
    setTimeout(() => {
      img.classList.add('visible');
    }, 900);

    // Step 4: show reset
    setTimeout(() => {
      hint.style.display = 'none';
      resetBtn.style.display = 'block';
    }, 1200);
  }

  function resetEnvelope() {
    const envWrap = document.getElementById('envWrap');
    const flap = document.getElementById('envFlap');
    const hint = document.getElementById('hint');
    const resetBtn = document.getElementById('resetBtn');
    const img = document.getElementById('inviteImg');

    img.classList.remove('visible');
    resetBtn.style.display = 'none';

    setTimeout(() => {
      flap.classList.remove('flap-opened');
      envWrap.classList.remove('gone', 'opening');
    }, 400);

    setTimeout(() => {
      hint.style.display = 'block';
      hint.style.opacity = '';
      hint.style.animation = 'pulse 2s infinite';
      opened = false;
    }, 800);
  }
</script>
